<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />

  <title>{% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- meta -->
  <meta name="robots" content="index, follow" />
  <meta name="googlebot" content="index, follow, snippet, archive" />
  <meta name="author" content="{{ site.author.name }}, {{ site.author.url }}" />
  <meta name="keywords" content="openspace, non-conference, developers, podcast, presentations" />
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="HIDXDYvVDyhunDUovEXgLbJEAWD6xH8agaWVvgaYyq8" />

  <!-- Standard favicon -->
  <link rel="icon" href="{{ site.baseurl }}/favicon.ico" sizes="any">

  <!-- PNG favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/public/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/public/images/favicon/favicon-16x16.png">

  <!-- Apple Touch Icon (for iOS) -->
  <link rel="apple-touch-icon" href="{{ site.baseurl }}/public/images/favicon/apple-touch-icon.png">

  <!-- Android/Progressive Web App -->
  <link rel="manifest" href="{{ site.baseurl }}/public/images/favicon/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,300&amp;subset=latin,latin-ext&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" media="screen" href="{{ site.baseurl }}/public/js/highslide/highslide.css">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/public/css/main.css?v=20261006-gallery" />

  <script defer src="{{ site.baseurl }}/public/js/jquery-1.8.js"></script>
  <script defer src="{{ site.baseurl }}/public/js/jquery.organicTabs.js"></script>
  <script defer src="{{ site.baseurl }}/public/js/highslide/highslide-full.js"></script>
  <script defer src="{{ site.baseurl }}/public/js/main.js?v=202610052300"></script>
</head>
